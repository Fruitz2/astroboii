<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app1.jsx"></script>
<script type="text/babel" src="app2.jsx"></script>
<script type="text/babel">
  const { Starfield, useReveal, Navbar, MobileMenu, Hero, Ticker, Statement, ASTRO_CONFIG } = window.A1;
  const { Lore, Token, Roadmap, Community, Final, Footer } = window.A2;
  const { TweaksPanel, useTweaks, TweakSection, TweakToggle, TweakText } = window;

  function App() {
    const [tweaks, setTweak] = useTweaks(ASTRO_CONFIG);
    const [menu, setMenu] = React.useState(false);
    useReveal();
    const isLaunched = !!tweaks.isLaunched;
    return (
      <>
        <Starfield />
        <Navbar onMenu={()=>setMenu(true)} isLaunched={isLaunched} />
        <MobileMenu open={menu} onClose={()=>setMenu(false)} isLaunched={isLaunched} />
        <Hero isLaunched={isLaunched} />
        <Ticker isLaunched={isLaunched} />
        <Lore />
        <Statement />
        <Token />
        <Roadmap />
        <Community />
        <Final isLaunched={isLaunched} />
        <Footer />
        <TweaksPanel title="Tweaks">
          <TweakSection title="Launch state">
            <TweakToggle label="Is launched" value={tweaks.isLaunched} onChange={v=>setTweak('isLaunched', v)} />
            <TweakText label="Ticker" value={tweaks.ticker} onChange={v=>setTweak('ticker', v)} />
            <TweakText label="Contract address" value={tweaks.contractAddress} onChange={v=>setTweak('contractAddress', v)} placeholder="paste CA on launch" />
          </TweakSection>
          <TweakSection title="Links">
            <TweakText label="Pump.fun URL" value={tweaks.pumpFunUrl} onChange={v=>setTweak('pumpFunUrl', v)} />
            <TweakText label="Telegram" value={tweaks.telegramUrl} onChange={v=>setTweak('telegramUrl', v)} />
            <TweakText label="X" value={tweaks.xUrl} onChange={v=>setTweak('xUrl', v)} />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
